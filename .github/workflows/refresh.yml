name: 오래된 사실 갱신 (하루 한 편)

on:
  schedule:
    # 밤 22~06시 KST 한 번 (scripts/refresh_facts.py 가 한 밤에 한 편만 고치므로 두 번 걸어도 안전).
    # GitHub 예약은 몇 시간씩 밀리므로 첫 예약을 이르게 둡니다.
    - cron: "50 13 * * *"   # 22:50 KST
    - cron: "20 17 * * *"   # 02:20 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "고치지 않고 볼 순서만 보기"
        type: boolean
        default: true
      url:
        description: "이 글만 확인 (시간대·간격 무시)"
        type: string
        default: ""

# 그룹은 따로 쓰고(같은 그룹이면 대기 실행이 뒤에 온 실행에 밀려 취소됨, 2026-11-01) 겹치지 않게 하는 일은
# '차례 기다리기' 단계가 합니다. 원래 이유: 함대 실행·기존 글 정리와 같은 파일(data/)을 건드리고 같은 계정에 쓰기 요청을 보내므로 같은 그룹에서 차례로 돕니다.
concurrency:
  group: fleet-refresh
  cancel-in-progress: false

permissions:
  contents: write
  actions: read   # 앞선 함대 워크플로 실행 확인 (scripts/wait_turn.py)

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 220   # 확인 20분 + 차례 기다리기 200분

    steps:
      - uses: actions/checkout@v5

      # 함대 실행·관리·정리 가운데 먼저 온 실행이 끝날 때까지 기다립니다 (scripts/wait_turn.py).
      # 200분이 지나도 안 끝났으면 늦게라도 돕니다.
      - name: 차례 기다리기
        id: turn
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/wait_turn.py --max-wait 200 --on-timeout go
          # 기다리는 동안 앞선 실행이 커밋한 이력을 받아 둡니다.
          git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" || true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 오늘 몫 한 편 확인
        env:
          # 공식 자료 조사(웹 검색) + 대조·검수 모델, 글당 약 $0.2
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUTF8: "1"
          # 계정을 추가하면 fleet.yml 과 같이 여기에도 세 줄을 추가하세요 (test_logic.py 가 확인합니다).
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_CLIENT_ID_SECOND: ${{ secrets.BLOGGER_CLIENT_ID_SECOND }}
          BLOGGER_CLIENT_SECRET_SECOND: ${{ secrets.BLOGGER_CLIENT_SECRET_SECOND }}
          BLOGGER_REFRESH_TOKEN_SECOND: ${{ secrets.BLOGGER_REFRESH_TOKEN_SECOND }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.url }}" ]; then ARGS="$ARGS --url ${{ github.event.inputs.url }}"; fi
          python scripts/refresh_facts.py $ARGS

      - name: 기록 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add data/fleet/ data/blogs/
          if git diff --staged --quiet; then
            echo "변경 사항 없음."
          else
            git commit -m "chore: 사실 갱신 기록 ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push || (git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push)
          fi
