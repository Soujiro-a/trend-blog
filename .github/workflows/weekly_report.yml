name: 주간 운영 보고

on:
  schedule:
    # 매주 월요일 00:20 UTC = 월요일 09:20 KST.
    - cron: "20 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write     # 보고서를 이슈로 만들어 메일 알림을 받기 위해

jobs:
  report:
    runs-on: ubuntu-24.04   # fleet.yml 과 같은 이유로 고정 (ubuntu-latest 는 2026-10-19 에 바뀜)
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 보고서 생성
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          PYTHONUTF8: "1"
          # 계정별 자격증명 — fleet.yml·manager.yml 과 같은 목록. 계정을 추가하면 여기에도 세 줄.
          # (예전엔 default 계정 것만 넘겨서, second 계정 블로그의 Blogger·검색 유입이 보고서에 빠졌습니다)
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_CLIENT_ID_SECOND: ${{ secrets.BLOGGER_CLIENT_ID_SECOND }}
          BLOGGER_CLIENT_SECRET_SECOND: ${{ secrets.BLOGGER_CLIENT_SECRET_SECOND }}
          BLOGGER_REFRESH_TOKEN_SECOND: ${{ secrets.BLOGGER_REFRESH_TOKEN_SECOND }}
        run: |
          python scripts/weekly_report.py --out report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 이슈로 올리기 (메일 알림)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="주간 보고 $(date -u -d '+9 hours' +'%Y-%m-%d')"
          if grep -q "확인이 필요한 항목" report.md; then
            LABEL="needs-attention"
          else
            LABEL="report"
          fi
          gh label create "$LABEL" --force --color "$([ "$LABEL" = report ] && echo 0E8A16 || echo D93F0B)" >/dev/null 2>&1 || true
          # 지난주 보고 이슈는 닫아서 열린 이슈가 쌓이지 않게 합니다. 라벨을 한 번에 두 개 주면
          # '둘 다 붙은 이슈'만 찾아서 아무것도 닫히지 않았습니다(2026-09 에 6개가 쌓임). 라벨별로 따로 닫습니다.
          for L in report needs-attention; do
            gh issue list --label "$L" --state open --json number --jq '.[].number' \
              | xargs -r -I{} gh issue close {} --comment "새 주간 보고로 대체" || true
          done
          gh issue create --title "$TITLE" --body-file report.md --label "$LABEL"
