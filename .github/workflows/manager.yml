name: 함대 관리 에이전트

on:
  schedule:
    # 매일 14:35 UTC = 23:35 KST. 마지막 슬롯(최대 21:00 KST)의 실행까지 끝난 뒤입니다.
    - cron: "35 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "판단만 보고 적용하지 않음"
        type: boolean
        default: false

concurrency:
  group: fleet          # 함대 실행과 같은 파일(data/)을 건드리므로 같은 그룹
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  manage:
    runs-on: ubuntu-24.04   # fleet.yml 과 같은 이유로 고정 (ubuntu-latest 는 2026-10-19 에 바뀜)
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 관리 에이전트 실행
        id: manage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUTF8: "1"
          # 계정을 추가하면 여기에도 세 줄 추가 (fleet.yml·weekly_report.yml 과 같은 목록)
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_CLIENT_ID_SECOND: ${{ secrets.BLOGGER_CLIENT_ID_SECOND }}
          BLOGGER_CLIENT_SECRET_SECOND: ${{ secrets.BLOGGER_CLIENT_SECRET_SECOND }}
          BLOGGER_REFRESH_TOKEN_SECOND: ${{ secrets.BLOGGER_REFRESH_TOKEN_SECOND }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          set +e
          python -m src.manager $ARGS
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          cat data/fleet/manager_report.md >> "$GITHUB_STEP_SUMMARY"
          # 2 = 사람이 볼 것이 있음 (정상 종료). 그 외 0 이 아니면 진짜 실패.
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then exit "$code"; fi

      - name: 상태 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add data/fleet/
          if git diff --staged --quiet; then echo "변경 사항 없음."; else
            git commit -m "chore: 함대 관리 상태 갱신 ($(date -u +'%Y-%m-%d') UTC)"
            git push || (git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push)
          fi

      - name: 조치·경고가 있으면 이슈로 알림
        if: steps.manage.outputs.exit == '2' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "fleet" --force --color 5319E7 >/dev/null 2>&1 || true
          gh issue list --label fleet --state open --json number --jq '.[].number' \
            | xargs -r -I{} gh issue close {} --comment "새 관리 보고로 대체" || true
          gh issue create --title "함대 관리 $(date -u -d '+9 hours' +'%Y-%m-%d')" --body-file data/fleet/manager_report.md --label fleet

      # 오늘 볼 것이 없으면, 열려 있는 지난 보고는 닫습니다. 예전엔 새 보고가 나올 때까지 며칠이고
      # 열려 있어서 이미 끝난 조치(예: 없어진 증량 제안)가 할 일처럼 남아 있었습니다.
      - name: 볼 것이 없으면 지난 관리 이슈 닫기
        if: steps.manage.outputs.exit == '0' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label fleet --state open --json number --jq '.[].number' \
            | xargs -r -I{} gh issue close {} --comment "$(date -u -d '+9 hours' +'%Y-%m-%d') 관리 보고: 조치·경고 없음" || true
