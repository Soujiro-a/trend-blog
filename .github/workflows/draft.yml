name: 실시간 이슈 글 작성·공개 (단일 블로그 · 수동)

# 예약 실행은 fleet.yml(블로그 함대)로 옮겼습니다. 이 워크플로는 .env 의 BLOGGER_BLOG_ID 한 블로그를
# 수동으로 돌려볼 때만 씁니다. 함대에 등록된 블로그를 여기서도 돌리면 같은 날 두 번 쓰게 됩니다.
on:
  workflow_dispatch:       # Actions 탭에서 수동 실행
    inputs:
      count:
        description: "작성할 글 개수 (비워두면 config.yaml 의 posts_per_run 사용)"
        required: false
        default: ""
      dry_run:
        description: "키워드만 확인 (글 작성 안 함)"
        type: boolean
        default: false
      draft:
        description: "검수 결과와 무관하게 전부 임시저장"
        type: boolean
        default: false

# 이전 실행이 안 끝났으면 겹쳐 돌지 않게 합니다.
concurrency:
  group: draft-posts
  cancel-in-progress: false

permissions:
  contents: write   # data/history.json 을 다시 커밋하기 위해 필요

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 글 작성 → AI 검수 → 공개/임시저장
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          PYTHONUTF8: "1"
        run: |
          # 개수는 config.yaml 의 posts_per_run 을 기본으로 씁니다.
          # 수동 실행에서 값을 넣었을 때만 --count 로 덮어씁니다.
          ARGS=""
          if [ -n "${{ github.event.inputs.count }}" ]; then
            ARGS="$ARGS --count ${{ github.event.inputs.count }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.draft }}" = "true" ]; then
            ARGS="$ARGS --draft"
          fi
          echo "실행: python -m src.main $ARGS"
          python -m src.main $ARGS

      - name: 실행 결과를 요약에 남기기
        if: always()
        run: |
          if [ -f data/last_run.md ]; then
            cat data/last_run.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "보고서가 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 작성 이력 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 실행 중에 다른 워크플로가 이력을 커밋했을 수 있으니 먼저 받아옵니다.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add data/
          if git diff --staged --quiet; then
            echo "변경 사항 없음."
          else
            git commit -m "chore: 작성 이력 갱신 ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi
