name: 실시간 이슈 글 임시저장

on:
  schedule:
    # GitHub cron 은 UTC 기준입니다. 한국시간(KST) = UTC + 9시간.
    # 19:30 UTC = 다음날 04:30 KST.
    #
    # 목표는 "아침 6시에 초안이 준비돼 있는 것"인데, 일부러 1시간 30분 앞당겼습니다.
    # GitHub 예약 실행은 지연이 큽니다. 실제로 06:00 예약이 08:02 에 돈 적이 있습니다.
    # 정시(0분)는 전 세계가 몰리는 가장 혼잡한 슬롯이라 더 밀립니다.
    # 그래서 정시를 피하고 여유를 둡니다. 지연이 없으면 04:30, 밀려도 6시쯤 도착합니다.
    - cron: "30 19 * * *"
  workflow_dispatch:       # Actions 탭에서 수동 실행
    inputs:
      count:
        description: "작성할 글 개수 (비워두면 config.yaml 의 posts_per_run 사용)"
        required: false
        default: ""
      dry_run:
        description: "키워드만 확인 (글 작성 안 함)"
        type: boolean
        default: false

# 이전 실행이 안 끝났으면 겹쳐 돌지 않게 합니다.
concurrency:
  group: draft-posts
  cancel-in-progress: false

permissions:
  contents: write   # data/history.json 을 다시 커밋하기 위해 필요

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 글 작성 후 Blogger 임시저장
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          PYTHONUTF8: "1"
        run: |
          # 개수는 config.yaml 의 posts_per_run 을 기본으로 씁니다.
          # 수동 실행에서 값을 넣었을 때만 --count 로 덮어씁니다.
          ARGS=""
          if [ -n "${{ github.event.inputs.count }}" ]; then
            ARGS="$ARGS --count ${{ github.event.inputs.count }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "실행: python -m src.main $ARGS"
          python -m src.main $ARGS

      - name: 실행 결과를 요약에 남기기
        if: always()
        run: |
          if [ -f data/last_run.md ]; then
            cat data/last_run.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "보고서가 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 작성 이력 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 사항 없음."
          else
            git commit -m "chore: 작성 이력 갱신 ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi
