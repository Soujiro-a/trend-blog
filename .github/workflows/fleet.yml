name: 블로그 함대 실행

on:
  schedule:
    # 10분마다 예약하지만 GitHub 은 부하가 많으면 예약 실행을 건너뜁니다. 2026-09 에는 실제로 3~5시간에
    # 한 번꼴로 돌았습니다. 그래서 실행기는 '슬롯 시각이 지났고 오늘 아직 안 돈' 슬롯을 그날 안에 모두 따라잡고,
    # 같은 계정의 글 사이는 account_gap_minutes(30분+) 로 벌립니다. 슬롯 시각은 '이 시각 이후 첫 실행'입니다.
    # 정시(0분) 슬롯은 전 세계가 몰려 더 밀리므로 5분 어긋나게 둡니다.
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:
    inputs:
      blog:
        description: "특정 블로그 id 만 실행 (비워두면 지금 돌 차례인 블로그)"
        required: false
        default: ""
      all:
        description: "켜진 블로그 전부 실행 (슬롯 무시)"
        type: boolean
        default: false
      dry_run:
        description: "글을 쓰지 않고 대상 슬롯·계정 자격증명만 확인"
        type: boolean
        default: false

# 함대 실행이 겹치면 이력·선점 파일이 충돌합니다. 진행 중이면 새 실행은 대기(큐)합니다.
concurrency:
  group: fleet
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # 계정 비상정지 알림

jobs:
  fleet:
    # ubuntu-latest 는 2026-10-19 부터 Ubuntu 26 으로 바뀝니다. 이미지가 바뀌는 날 자동화가 깨지지 않게 고정합니다.
    runs-on: ubuntu-24.04
    # 밀린 슬롯을 처리할 때 같은 계정 글 사이를 30~40분씩 벌리므로 길게 둡니다.
    # fleet/blogs.yaml 의 run_budget_minutes(150) 보다 커야 합니다. 공개 저장소라 Actions 시간은 무료입니다.
    timeout-minutes: 200

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 함대 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          PYTHONUTF8: "1"
          # ── 구글 계정별 자격증명 ──────────────────────────────────────────
          # 계정을 추가하면 여기에 세 줄, 그리고 manager.yml·weekly_report.yml 에도 같은 세 줄을 추가하세요.
          # (빠뜨리면 python scripts/test_logic.py 가 알려 줍니다)
          # 변수 이름 규칙: default 는 접미사 없음, 그 외는 _<계정이름대문자>
          #
          # 예전에는 toJSON(secrets) 로 전부 한 번에 넘겼지만 두 가지 이유로 되돌렸습니다.
          #   1) GitHub 이 그 실행을 action_required 로 막았습니다 (2026-09-21)
          #   2) 이 저장소는 공개입니다. 모든 시크릿을 환경에 풀어 두면 Blogger 와 무관한
          #      단계나 의존성까지 전부 읽을 수 있게 됩니다. 필요한 것만 넘기는 편이 안전합니다.
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_CLIENT_ID_SECOND: ${{ secrets.BLOGGER_CLIENT_ID_SECOND }}
          BLOGGER_CLIENT_SECRET_SECOND: ${{ secrets.BLOGGER_CLIENT_SECRET_SECOND }}
          BLOGGER_REFRESH_TOKEN_SECOND: ${{ secrets.BLOGGER_REFRESH_TOKEN_SECOND }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.blog }}" ]; then ARGS="$ARGS --blog ${{ github.event.inputs.blog }}"; fi
          if [ "${{ github.event.inputs.all }}" = "true" ]; then ARGS="$ARGS --all"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "실행: python -m src.fleet_run $ARGS"
          python -m src.fleet_run $ARGS

      - name: 실행 결과를 요약에 남기기
        if: always()
        run: |
          if [ -f data/fleet/last_fleet_run.md ]; then
            cat data/fleet/last_fleet_run.md >> "$GITHUB_STEP_SUMMARY"
            # last_run.md 는 깃에 없으므로, 새로 체크아웃한 러너에 있는 것은 전부 이번 실행이 쓴 것입니다.
            for f in data/blogs/*/last_run.md; do
              if [ -f "$f" ]; then echo "" >> "$GITHUB_STEP_SUMMARY"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
            done
          fi

      - name: 계정 비상정지 알림
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f data/fleet/halt_alert.md ]; then
            gh label create fleet-halt --color B60205 --description "계정 비상정지" 2>/dev/null || true
            gh issue create --title "⛔ 계정 비상정지 $(date -u -d '+9 hours' +'%Y-%m-%d %H:%M') KST" \
              --body-file data/fleet/halt_alert.md --label fleet-halt
            rm data/fleet/halt_alert.md
          fi

      - name: 이력 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add data/
          if git diff --staged --quiet; then
            echo "변경 사항 없음."
          else
            git commit -m "chore: 함대 이력 갱신 ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push || (git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push)
          fi
