name: 블로그 함대 실행

on:
  schedule:
    # 10분마다. 실행기는 '슬롯이 지났고 오늘 아직 안 돈' 블로그만 슬롯 순서대로 하나씩 돌립니다.
    # GitHub 예약이 밀려도(자주 그럽니다) 그날 안에는 처리되고, 밀린 블로그들도 순서대로
    # 각각 3~4분씩 돌기 때문에 블로그 간 간격은 유지됩니다.
    # 정시(0분) 슬롯은 전 세계가 몰려 더 밀리므로 5분 어긋나게 둡니다.
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:
    inputs:
      blog:
        description: "특정 블로그 id 만 실행 (비워두면 지금 돌 차례인 블로그)"
        required: false
        default: ""
      all:
        description: "켜진 블로그 전부 실행 (슬롯 무시)"
        type: boolean
        default: false
      count:
        description: "글 개수 덮어쓰기"
        required: false
        default: ""
      dry_run:
        description: "글을 쓰지 않고 대상 슬롯·계정 자격증명만 확인"
        type: boolean
        default: false

# 함대 실행이 겹치면 이력·선점 파일이 충돌합니다. 진행 중이면 새 실행은 대기(큐)합니다.
concurrency:
  group: fleet
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 55   # 밀린 블로그 여러 개를 한 번에 처리할 수 있게 넉넉히

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 함대 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          PYTHONUTF8: "1"
          # ── 구글 계정별 자격증명 ──────────────────────────────────────────
          # 계정을 추가하면 여기에 세 줄, 그리고 manager.yml 에도 같은 세 줄을 추가하세요.
          # 변수 이름 규칙: default 는 접미사 없음, 그 외는 _<계정이름대문자>
          #
          # 예전에는 toJSON(secrets) 로 전부 한 번에 넘겼지만 두 가지 이유로 되돌렸습니다.
          #   1) GitHub 이 그 실행을 action_required 로 막았습니다 (2026-09-21)
          #   2) 이 저장소는 공개입니다. 모든 시크릿을 환경에 풀어 두면 Blogger 와 무관한
          #      단계나 의존성까지 전부 읽을 수 있게 됩니다. 필요한 것만 넘기는 편이 안전합니다.
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_CLIENT_ID_SECOND: ${{ secrets.BLOGGER_CLIENT_ID_SECOND }}
          BLOGGER_CLIENT_SECRET_SECOND: ${{ secrets.BLOGGER_CLIENT_SECRET_SECOND }}
          BLOGGER_REFRESH_TOKEN_SECOND: ${{ secrets.BLOGGER_REFRESH_TOKEN_SECOND }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.blog }}" ]; then ARGS="$ARGS --blog ${{ github.event.inputs.blog }}"; fi
          if [ "${{ github.event.inputs.all }}" = "true" ]; then ARGS="$ARGS --all"; fi
          if [ -n "${{ github.event.inputs.count }}" ]; then ARGS="$ARGS --count ${{ github.event.inputs.count }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "실행: python -m src.fleet_run $ARGS"
          python -m src.fleet_run $ARGS

      - name: 실행 결과를 요약에 남기기
        if: always()
        run: |
          if [ -f data/fleet/last_fleet_run.md ]; then
            cat data/fleet/last_fleet_run.md >> "$GITHUB_STEP_SUMMARY"
            for f in data/blogs/*/last_run.md; do
              if [ -f "$f" ] && [ -n "$(find "$f" -mmin -50)" ]; then echo "" >> "$GITHUB_STEP_SUMMARY"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
            done
          fi

      - name: 이력 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add data/
          if git diff --staged --quiet; then
            echo "변경 사항 없음."
          else
            git commit -m "chore: 함대 이력 갱신 ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push || (git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push)
          fi
