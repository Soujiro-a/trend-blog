name: 장수 해설 글 작성

on:
  schedule:
    # 매주 일요일 20:40 UTC = 월요일 05:40 KST.
    # 실시간 글(04:30)과 겹치지 않게 1시간 뒤, 정시 슬롯은 피합니다.
    - cron: "40 20 * * 0"
  workflow_dispatch:
    inputs:
      count:
        description: "작성할 글 개수 (비워두면 config.yaml 의 evergreen.posts_per_run)"
        required: false
        default: ""

concurrency:
  group: draft-posts        # 실시간 글 워크플로와 같은 그룹 → 이력 커밋 충돌 방지
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  evergreen:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 장수 글 작성 → 검수 → 공개
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          PYTHONUTF8: "1"
        run: |
          ARGS="--mode evergreen"
          if [ -n "${{ github.event.inputs.count }}" ]; then
            ARGS="$ARGS --count ${{ github.event.inputs.count }}"
          fi
          echo "실행: python -m src.main $ARGS"
          python -m src.main $ARGS

      - name: 실행 결과를 요약에 남기기
        if: always()
        run: |
          if [ -f data/last_run.md ]; then
            cat data/last_run.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "보고서가 생성되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 작성 이력 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add data/
          if git diff --staged --quiet; then
            echo "변경 사항 없음."
          else
            git commit -m "chore: 장수 글 이력 갱신 ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi
