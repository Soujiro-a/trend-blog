name: 기존 글 정리 (하루 한 편)

on:
  schedule:
    # 글 작성 슬롯(06:20 KST~)과 겹치지 않게 새벽에만 돕니다. GitHub 예약은 몇 시간씩 밀리거나 건너뛰는 일이
    # 잦아(2026-09 실측) 세 번 걸어 둡니다. 스크립트가 하루 한 편만 고치고(data/fleet/retrofit.json),
    # KST 00~06시가 아니면 아무것도 하지 않으므로 여러 번 돌아도 안전합니다.
    - cron: "5 16 * * *"    # 01:05 KST
    - cron: "5 18 * * *"    # 03:05 KST
    - cron: "35 19 * * *"   # 04:35 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "고치지 않고 대상만 보기"
        type: boolean
        default: true

# 함대 실행·관리와 같은 파일(data/)을 건드리고, 같은 계정에 쓰기 요청을 보내므로 같은 그룹에서 차례로 돕니다.
concurrency:
  group: fleet
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retrofit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 요약 카드(src/card.py)에 쓰는 한글 글꼴. 10MB 라 저장소에 올리지 않고 받아서 캐시해 둡니다.
      # 받지 못해도 실행은 계속되고 글이 카드 없이 발행됩니다.
      - uses: actions/cache@v4
        with:
          path: assets/fonts
          key: noto-sans-kr-vf-1

      - name: 요약 카드 글꼴
        run: |
          mkdir -p assets/fonts
          F=assets/fonts/NotoSansKR-VF.ttf
          [ -s "$F" ] || curl -fsSL --retry 3 -o "$F" "https://github.com/google/fonts/raw/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf" \
            || { rm -f "$F"; echo "글꼴을 받지 못했습니다 — 이번 실행은 요약 카드 없이 진행합니다."; }

      - name: 오늘 몫 한 편 고치기
        env:
          PYTHONUTF8: "1"
          # 카드가 없는 기존 글은 본문에서 카드 글을 뽑습니다 (글당 약 $0.02)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 요약 카드 이미지를 저장소 cards/ 에 커밋합니다 (permissions: contents: write)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 계정을 추가하면 fleet.yml 과 같이 여기에도 세 줄을 추가하세요 (test_logic.py 가 확인합니다).
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_CLIENT_ID_SECOND: ${{ secrets.BLOGGER_CLIENT_ID_SECOND }}
          BLOGGER_CLIENT_SECRET_SECOND: ${{ secrets.BLOGGER_CLIENT_SECRET_SECOND }}
          BLOGGER_REFRESH_TOKEN_SECOND: ${{ secrets.BLOGGER_REFRESH_TOKEN_SECOND }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/retrofit_posts.py --dry-run
          else
            python scripts/retrofit_posts.py
          fi

      - name: 기록 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add data/fleet/
          if git diff --staged --quiet; then
            echo "변경 사항 없음."
          else
            git commit -m "chore: 기존 글 정리 기록 ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push || (git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push)
          fi
