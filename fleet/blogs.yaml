# 블로그 함대(fleet) 설정 — 블로그마다 겹치지 않는 고유 주제를 갖고, 서로 다른 시각에 글을 올립니다.
#
# 2026-09-20 사고 이후 운영 방식이 바뀌었습니다.
#   이전: 모든 블로그가 같은 실시간 검색어 목록을 보고 글을 씀 → 같은 사건이 여러 블로그에 실림
#   지금: 블로그마다 subject(고유 주제)를 정하고 그 안에서 글감을 기획 → 주제 충돌이 설계상 불가능
# 그리고 슬롯 하나당 글 1건입니다. 하루 2건이면 슬롯을 2개(아침·오후) 둬서 몰아 올리지 않습니다.
#
# 블로그 추가:
#   python scripts/fleet_cli.py add --name "이름" --blog-id 1234567890 --subject "고유 주제"
#   python scripts/fleet_cli.py discover --add      # 계정의 모든 블로그를 한 번에 등록
#   python scripts/fleet_cli.py list                # 현재 슬롯표
#
# 시크릿(refresh token 등)은 여기 두지 않습니다. 계정(accounts) 이름으로 환경변수를 찾습니다.
# 관리 에이전트(src/manager.py)의 결정은 data/fleet/manager_state.json 에 저장되고 실행 시 덧씌워집니다.

fleet:
  timezone: Asia/Seoul
  slot_start: "06:20"       # 첫 슬롯. 04~05시대는 사람이 글 쓰는 시간대가 아니라 오전으로 옮겼습니다.
  slot_end: "21:00"         # 마지막 슬롯 한계
  slot_step_minutes: 20     # 서로 다른 블로그 슬롯 사이 최소 간격
  own_slot_gap_minutes: 240 # 같은 블로그의 슬롯 사이 최소 간격(4시간)
  # 슬롯 시각이 지났는데 아직 안 돌았으면 그날 안에 처리합니다(GitHub 예약 실행 지연 대비).
  catch_up: true
  # 계정 전체가 하루에 공개할 수 있는 총 글 수. 구글이 보는 단위는 블로그가 아니라 **계정**입니다.
  # 2026-09-20 차단 당시 블로그별로는 2~8건이었지만 계정 합계가 16건이었습니다.
  # 새 계정은 6에서 시작해 몇 주에 걸쳐 천천히 올리세요. 블로그를 늘려도 이 값이 먼저 막습니다.
  max_live_per_day_account: 6
  # planned 모드에서는 블로그마다 주제가 달라 충돌이 없지만, trend 모드를 쓰는 블로그가 섞일 때를 위해 유지합니다.
  share_topics: false
  claim_days: 2
  claim_similarity: 0.4
  evergreen_weekday: -1     # planned 모드가 이미 장수 글이라 별도 장수 트랙은 끕니다.
  defaults:
    run:
      posts_per_run: 1      # 슬롯 하나당 1건 (하루 총량 = 슬롯 수)
    publish:
      max_live_per_day: 2   # 서버 기준 하루 상한. 실행이 몇 번 돌든 이 값을 넘을 수 없습니다.

# 구글 계정. **여러 계정을 한 저장소에서 함께 운영합니다** — 저장소를 복사할 필요가 없습니다.
#
# 구글의 제한은 계정 단위로 붙으므로(2026-09-20: 한 계정의 Blogger API 쓰기 차단),
# 계정을 나누면 하루 상한도 계정마다 따로 계산되고 한쪽이 막혀도 나머지는 계속 돕니다.
#
# 계정별 환경변수 (.env 와 GitHub Secrets 에 같은 이름으로):
#   default 계정 : BLOGGER_CLIENT_ID      / BLOGGER_CLIENT_SECRET      / BLOGGER_REFRESH_TOKEN
#   그 외        : BLOGGER_CLIENT_ID_<대문자> / BLOGGER_CLIENT_SECRET_<대문자> / BLOGGER_REFRESH_TOKEN_<대문자>
# 워크플로는 BLOGGER_ 로 시작하는 시크릿을 전부 자동으로 넘기므로 계정을 늘려도 워크플로는 그대로입니다.
#
# 추가: python scripts/account_cli.py add <이름>   (이후 순서를 안내합니다)
# 현황: python scripts/account_cli.py list
accounts:
  second:
    max_live_per_day_account: 4
  default:
    # 이 계정이 하루에 공개할 수 있는 총 글 수. 비워 두면 fleet.max_live_per_day_account 를 씁니다.
    # 새 계정은 3~4에서 시작해 몇 주에 걸쳐 올리세요.
    max_live_per_day_account: 6

blogs:
  - id: picktopic
    name: 픽토픽
    blog_id: "8560213590293003276"
    account: default
    slots: ["06:20", "15:00"]
    enabled: true
    content_mode: planned
    subject: "생활 속 정부 지원·행정 절차"
    pillars:
      - 정부·지자체 지원금과 신청 자격
      - 각종 증명서·민원 처리 방법
      - 자격 확인과 온라인 신청 절차
      - 제도 변경 시 달라지는 점
    audience: "지원금이나 민원 처리 방법을 검색해서 들어오는 일반 성인"
    persona: >-
      절차를 설명하는 글입니다. 첫 문단에서 "누가 받을 수 있고 어디서 신청하는지"를 먼저 말하고,
      본문은 번호 매긴 단계로 씁니다. 자격 조건은 표로 정리합니다.
      금액·기한은 바뀔 수 있으므로 "기준일 현재" 를 붙이고 공식 사이트 확인을 안내합니다.
    labels: [생활행정]
    overrides: {}

  - id: issuecatch1
    name: 이슈캐치
    blog_id: "5778861407948563703"
    account: default
    slots: ["06:40", "15:20"]
    enabled: true
    content_mode: planned
    subject: "세금과 공제 기초"
    pillars:
      - 연말정산 항목별 공제 조건
      - 종합소득세·부가세 신고 기초
      - 프리랜서·부업 소득 신고
      - 세금 용어와 계산 구조
    audience: "연말정산이나 세금 신고를 앞두고 검색하는 직장인·프리랜서"
    persona: >-
      세금은 틀리면 손해로 이어지므로 정확도를 최우선으로 씁니다. 조건은 "해당되는 경우 / 아닌 경우"로
      나눠 표로 보여주고, 계산이 필요한 항목은 간단한 예시 숫자로 과정을 보여줍니다.
      절세 '꿀팁' 식 단정은 쓰지 않고, 애매한 항목은 국세청 상담을 안내합니다.
    labels: [세금기초]
    overrides: {}

  - id: fastopic1
    name: 발빠른토픽
    blog_id: "6947597000053412236"
    account: default
    slots: ["07:00", "15:40"]
    enabled: true
    content_mode: planned
    subject: "직장 생활 실무 규정"
    pillars:
      - 근로기준법과 휴가·수당
      - 4대보험과 퇴직금
      - 근로계약서와 수습·퇴사 절차
      - 직장 내 제도와 권리
    audience: "회사 규정이나 자기 권리를 확인하려고 검색하는 직장인"
    persona: >-
      "내 경우엔 어떻게 되나"에 답하는 글입니다. 법 조항을 그대로 옮기지 말고 상황별로 나눠 설명합니다.
      계산이 있는 항목(연차 일수, 퇴직금, 실업급여)은 계산식과 예시를 함께 보여줍니다.
      분쟁 성격의 사안은 단정하지 말고 고용노동부 상담·신고 절차를 안내합니다.
    labels: [직장실무]
    overrides: {}

  - id: nowissue1
    name: 지금이슈
    blog_id: "7809446170110384025"
    account: default
    slots: ["07:20", "16:00"]
    enabled: true
    content_mode: planned
    subject: "전월세와 주거 계약"
    pillars:
      - 전월세 계약과 특약
      - 보증금 보호와 대항력·확정일자
      - 관리비·수선비 부담 기준
      - 이사와 계약 종료 절차
    audience: "전월세 계약을 앞두거나 집 문제로 검색하는 세입자"
    persona: >-
      돈이 크게 걸린 주제라 "이것만은 확인하세요"를 앞에 둡니다. 계약서 문구는 실제 예시 문장으로 보여주고,
      기한이 있는 절차(확정일자, 갱신 요구, 통지)는 날짜 기준을 표로 정리합니다.
      개별 분쟁 판단은 하지 않고 대한법률구조공단·주택도시보증공사 같은 공식 창구를 안내합니다.
    labels: [주거생활]
    overrides: {}

  - id: issuepick1
    name: 이슈픽
    blog_id: "7779083081554971282"
    account: default
    slots: ["07:40", "16:20"]
    enabled: true
    content_mode: planned
    subject: "스마트폰·디지털 서비스 사용법"
    pillars:
      - 스마트폰 설정과 문제 해결
      - 구독 서비스 관리와 해지
      - 계정 보안과 개인정보 설정
      - 자주 쓰는 앱의 숨은 기능
    audience: "기기나 앱 사용 중 막혀서 방법을 검색하는 일반 사용자"
    persona: >-
      화면을 보면서 따라 할 수 있게 씁니다. 메뉴 경로는 "설정 → 개인정보 보호 → ..." 형태로 정확히 적고,
      기종·버전에 따라 다르면 그 사실을 먼저 밝힙니다. 특정 제품을 추천하거나 비교 우위를 단정하지 않습니다.
    labels: [디지털생활]
    overrides: {}
  # --- second 계정 (2026-09-21 추가) ---
  #
  # 발행량 램프업 계획
  #   2026-09-21 ~ : 블로그당 하루 1건 (슬롯 1개). 새 블로그가 만들어지자마자 쏟아내는 패턴이
  #                  2026-09-20 계정 차단의 직접 원인이었으므로, 글이 쌓일 때까지 천천히 갑니다.
  #   2주쯤 뒤(10월 초) 각 블로그에 오후 슬롯을 하나씩 추가해 2건으로 올립니다.
  #     gaganam1  → slots: ["08:00", "14:00"]
  #     gaganamc1 → slots: ["11:00", "17:00"]
  #   올린 뒤에는 fleet_cli.py validate 로 간격을 확인하세요.
  - id: gaganam1
    name: "가가남블로그"
    blog_id: "6119386223221067366"
    account: second
    slots: ["08:00"]
    enabled: true
    content_mode: planned
    subject: "자동차 운전과 차량 관리"
    pillars:
      - 운전면허 취득·갱신과 적성검사
      - 자동차보험 가입과 사고 처리 절차
      - 정기검사·정비와 소모품 교체 주기
      - 과태료·범칙금과 이의신청
      - 중고차 매매와 이전등록 절차
    audience: "차를 사거나 몰면서 생기는 절차·비용을 검색하는 일반 운전자"
    persona: >-
      운전자가 실제로 처리해야 하는 일을 순서대로 알려주는 글입니다. 첫 문단에서 "언제까지 무엇을
      해야 하는지"를 먼저 말하고, 기한·필요 서류·처리 장소를 표로 정리합니다.
      과태료·수수료 같은 금액과 법 조항 번호는 참고 자료에 그대로 나오지 않으면 적지 말고,
      "도로교통공단 이지드라이브(safedriving.or.kr)나 자동차민원 대국민포털(ecar.go.kr)에서
      조회할 수 있습니다"처럼 확인 경로를 알려 주세요. 금액을 지어내면 검수에서 거부됩니다.
      특정 보험사나 정비소를 추천하지 않고, 사고 과실 판단 같은 개별 분쟁은 단정하지 않습니다.
    include_patterns: []
    exclude_patterns: []
    labels: [자동차생활]
    overrides: {}

  - id: gaganamc1
    name: "가가남씨블로그"
    blog_id: "3990482523331361857"
    account: second
    # 같은 계정의 두 블로그가 20분 간격으로 연달아 올리면 계정 단위로는 한꺼번에 움직이는 것으로 보입니다.
    # 3시간 벌려 둡니다.
    slots: ["11:00"]
    enabled: true
    content_mode: planned
    subject: "온라인 쇼핑과 소비자 권리"
    pillars:
      - 청약철회·환불·교환 기준과 기한
      - 배송 사고와 하자 제품 대응
      - 해외직구 통관과 관세
      - 중고거래 분쟁과 사기 예방
      - 정기결제·구독 해지와 위약금
    audience: "환불이 안 되거나 물건에 문제가 생겨 방법을 찾는 온라인 구매자"
    persona: >-
      "지금 내가 무엇을 요구할 수 있는지"에 답하는 글입니다. 법에서 보장하는 기한(청약철회 7일 등)을
      먼저 못박고, 상황별로 되는 경우와 안 되는 경우를 표로 나눕니다. 판매자에게 보낼 문구는 실제
      예시 문장으로 보여주고, 해결이 안 될 때 가는 곳(소비자24, 한국소비자원, 전자거래분쟁조정위원회)을
      단계별로 안내합니다. 특정 쇼핑몰을 비방하지 않고, 개별 사건의 승패를 단정하지 않습니다.
    include_patterns: []
    exclude_patterns: []
    labels: [소비자권리]
    overrides: {}
