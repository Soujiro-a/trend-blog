# 블로그 함대(fleet) 설정 — 블로그마다 겹치지 않는 고유 주제를 갖고, 서로 다른 시각에 글을 올립니다.
#
# 2026-09-20 사고 이후 운영 방식이 바뀌었습니다.
#   이전: 모든 블로그가 같은 실시간 검색어 목록을 보고 글을 씀 → 같은 사건이 여러 블로그에 실림
#   지금: 블로그마다 subject(고유 주제)를 정하고 그 안에서 글감을 기획 → 주제 충돌이 설계상 불가능
# 그리고 슬롯 하나당 글 1건입니다. 하루 2건이면 슬롯을 2개(아침·오후) 둬서 몰아 올리지 않습니다.
#
# 블로그 추가:
#   python scripts/fleet_cli.py add --name "이름" --blog-id 1234567890 --subject "고유 주제"
#   python scripts/fleet_cli.py discover --add      # 계정의 모든 블로그를 한 번에 등록
#   python scripts/fleet_cli.py list                # 현재 슬롯표
#
# 시크릿(refresh token 등)은 여기 두지 않습니다. 계정(accounts) 이름으로 환경변수를 찾습니다.
# 관리 에이전트(src/manager.py)의 결정은 data/fleet/manager_state.json 에 저장되고 실행 시 덧씌워집니다.

fleet:
  timezone: Asia/Seoul
  slot_start: "06:20"       # 첫 슬롯. 04~05시대는 사람이 글 쓰는 시간대가 아니라 오전으로 옮겼습니다.
  slot_end: "21:00"         # 마지막 슬롯 한계
  slot_step_minutes: 20     # 서로 다른 블로그 슬롯 사이 최소 간격
  own_slot_gap_minutes: 240 # 같은 블로그의 슬롯 사이 최소 간격(4시간)
  # 슬롯 시각이 지났는데 아직 안 돌았으면 그날 안에 처리합니다(GitHub 예약 실행 지연 대비).
  catch_up: true
  # 계정 전체가 하루에 공개할 수 있는 총 글 수. 구글이 보는 단위는 블로그가 아니라 **계정**입니다.
  # 2026-09-20 차단 당시 블로그별로는 2~8건이었지만 계정 합계가 16건이었습니다.
  # 새 계정은 6에서 시작해 몇 주에 걸쳐 천천히 올리세요. 블로그를 늘려도 이 값이 먼저 막습니다.
  max_live_per_day_account: 6
  # planned 모드에서는 블로그마다 주제가 달라 충돌이 없지만, trend 모드를 쓰는 블로그가 섞일 때를 위해 유지합니다.
  share_topics: false
  claim_days: 2
  claim_similarity: 0.4
  evergreen_weekday: -1     # planned 모드가 이미 장수 글이라 별도 장수 트랙은 끕니다.
  defaults:
    run:
      posts_per_run: 1      # 슬롯 하나당 1건 (하루 총량 = 슬롯 수)
    publish:
      max_live_per_day: 2   # 서버 기준 하루 상한. 실행이 몇 번 돌든 이 값을 넘을 수 없습니다.

# 구글 계정. **여러 계정을 한 저장소에서 함께 운영합니다** — 저장소를 복사할 필요가 없습니다.
#
# 구글의 제한은 계정 단위로 붙으므로(2026-09-20: 한 계정의 Blogger API 쓰기 차단),
# 계정을 나누면 하루 상한도 계정마다 따로 계산되고 한쪽이 막혀도 나머지는 계속 돕니다.
#
# 계정별 환경변수 (.env 와 GitHub Secrets 에 같은 이름으로):
#   default 계정 : BLOGGER_CLIENT_ID      / BLOGGER_CLIENT_SECRET      / BLOGGER_REFRESH_TOKEN
#   그 외        : BLOGGER_CLIENT_ID_<대문자> / BLOGGER_CLIENT_SECRET_<대문자> / BLOGGER_REFRESH_TOKEN_<대문자>
# 워크플로는 BLOGGER_ 로 시작하는 시크릿을 전부 자동으로 넘기므로 계정을 늘려도 워크플로는 그대로입니다.
#
# 추가: python scripts/account_cli.py add <이름>   (이후 순서를 안내합니다)
# 현황: python scripts/account_cli.py list
accounts:
  second:
    max_live_per_day_account: 4
  default:
    # 이 계정이 하루에 공개할 수 있는 총 글 수. 비워 두면 fleet.max_live_per_day_account 를 씁니다.
    # 새 계정은 3~4에서 시작해 몇 주에 걸쳐 올리세요.
    max_live_per_day_account: 6

