# 실시간 이슈 블로그 자동화 설정
# 시크릿(API 키 등)은 여기 두지 말고 환경변수 / GitHub Secrets 로 관리합니다.

run:
  # 한 번 실행할 때 작성할 글 개수 = 블로그당 하루 작성 수.
  # 2026-09-20 사고(계정 API 쓰기 차단) 이후 4 → 2 로 낮췄습니다.
  # 신규 블로그가 하루 여러 건을 쏟아내는 패턴이 자동 스팸 신호로 잡혔습니다.
  posts_per_run: 2
  # 키워드 수집은 실패해도 되지만, 최소 이만큼은 모여야 진행합니다.
  min_keywords: 5

trends:
  # 각 소스별 가중치. 0 으로 두면 해당 소스를 끕니다.
  sources:
    google_trends: 1.0   # 구글 트렌드 급상승 검색어 (KR)
    signal_bz: 1.0       # 시그널 실시간 검색어 (네이버/다음 통합 집계)
    nate: 0.8            # 네이트 실시간 이슈 키워드
    naver_news: 0.7      # 네이버 뉴스 많이 본 기사
    google_news: 0.5     # 구글 뉴스 헤드라인 (KR)
  # 여러 소스에 동시에 등장한 키워드에 곱해주는 보너스 (소스 1개 추가당)
  multi_source_bonus: 0.35
  # 각 소스에서 가져올 상위 개수
  top_n_per_source: 20

filters:
  # 글 소재로 부적합한 키워드를 거릅니다.
  # 실시간 검색어에는 개인 사건사고·범죄·사망 관련이 자주 올라오는데,
  # 이런 주제는 명예훼손 위험과 애드센스 정책 위반 소지가 커서 기본 차단합니다.
  block_sensitive: true
  sensitive_patterns:
    - 사망
    - 별세
    - 부고
    - 숨진
    - 숨져
    - 사고사
    - 자살
    - 극단적
    - 피의자
    - 피고인
    - 구속
    - 체포
    - 영장
    - 수사
    - 내사
    - 입건
    - 도청
    - 성폭행
    - 성추행
    - 성희롱
    - 몰카
    - 불법촬영
    - 마약
    - 음주운전
    - 학폭
    - 학교폭력
    - 열애
    - 결별
    - 이혼
    - 불륜
    - 임신
    - 폭행
    - 살해
    - 살인
    - 유서
    - 빈소
    - 발인
    - 실종
    - 투병
    - 암투병
    - 논란
    - 갑질
    - 고소
    - 고발
    - 소송
    - 징역
    - 판결
    - 유출
    - 해킹
    - 사칭
    # 건강·응급 (개인 의료정보는 사생활입니다)
    - 응급실
    - 이송
    - 입원
    - 수술
    - 위독
    - 중태
    - 쓰러
    - 건강이상
    - 병상
    # 의혹·평판 (확인 안 된 내용을 쓰면 명예훼손 위험)
    - 의혹
    - 파문
    - 해명
    - 사과문
    - 징계
    - 퇴출
    - 사퇴
    - 횡령
    - 배임
    - 탈세
    - 사기
    - 도박
    - 흉기
  # 항상 제외할 키워드(정확히 일치하거나 포함되면 제외)
  block_keywords:
    - 날씨
    - 로또
    - 실시간
    - 라이브
  min_keyword_length: 2
  max_keyword_length: 30
  # 띄어쓰기 없는 한 단어 키워드의 최소 길이.
  # '축구', '수학', '정구' 처럼 두 글자짜리 단독 명사는 주제가 너무 넓어서
  # 검색 유입도 약하고 글도 얄팍해집니다. 3으로 두면 이런 것들이 걸러집니다.
  # ('오현규' 같은 세 글자 이름은 통과합니다. 4로 올리면 인명도 대부분 걸립니다.)
  # 같은 이슈를 다른 소스가 더 구체적으로 표현했다면 그쪽으로 자동 교체됩니다.
  min_standalone_length: 3

dedupe:
  # 같은(또는 비슷한) 키워드로 다시 쓰지 않을 기간
  history_days: 14
  # 토큰 자카드 유사도가 이 값을 넘으면 같은 주제로 간주
  similarity_threshold: 0.6

research:
  # 키워드마다 수집할 뉴스 기사 수
  articles_per_keyword: 8
  # 기사 본문 대신 제목+요약만 사용합니다(저작권 보호).
  max_context_chars: 6000

writer:
  # claude-fable-5-1: 가장 성능 좋은 모델 (입력 $10 / 출력 $50 per 1M, 글당 약 $0.25)
  # claude-opus-5:    절반 비용 (입력 $5 / 출력 $25, 글당 약 $0.12)
  # claude-sonnet-5:  가장 저렴 (입력 $2 / 출력 $10, 글당 약 $0.05)
  model: claude-fable-5-1
  max_tokens: 16000
  effort: high          # low | medium | high | xhigh | max
  target_length: 1900   # 최소 글자수(한글, 공백 포함). 보통 이보다 조금 길게 나옵니다.
  # 글 맨 아래에 붙는 안내 문구. {date} 자리에 작성일이 들어갑니다.
  # 아무것도 붙이지 않으려면 빈 따옴표("")로 두세요.
  # 실시간 이슈는 금방 상황이 바뀌므로, 작성 시점을 밝혀두면 나중에 내용이
  # 달라졌을 때 독자 항의를 줄일 수 있습니다. AI 작성 사실은 소개 페이지에 있습니다.
  footer_note: "{date}까지 공개된 보도를 기준으로 정리했습니다. 이후 상황이 달라질 수 있습니다."
  language: ko

# AI 검수 — 사람이 초안을 읽고 '게시'를 누르던 일을 대신합니다.
# 작성 모델과 별도 세션에서 참고 기사와 본문을 대조해 publish / hold / reject 를 판정합니다.
review:
  enabled: true
  model: claude-sonnet-5     # 검수는 작성보다 쉬운 일이라 Sonnet 으로 충분합니다 (글당 약 $0.03)
  effort: medium
  max_tokens: 2000
  # 이 점수 이상 + 판정 publish 여야 공개합니다. 낮추면 더 많이 공개되고 위험도 올라갑니다.
  min_score: 80

publish:
  # blogger | local
  # local 은 out/ 폴더에 HTML 파일로만 저장합니다(API 키 없이 테스트용).
  target: blogger
  # auto  → 검수 통과 글은 바로 공개, 나머지는 임시저장
  # draft → 전부 임시저장 (예전 방식. 사람이 직접 공개)
  mode: auto
  # 블로그 하나가 **하루에** 공개할 수 있는 최대 글 수.
  # 실행 횟수와 무관하게, 매 발행 직전에 Blogger 에 "오늘 몇 건 올렸나"를 물어 계산합니다(src/guard.py).
  # 로컬 이력이 깨지거나 같은 날 여러 번 실행돼도 이 값을 넘을 수 없습니다.
  # 2026-09-20 사고에서는 이 상한이 '실행당'이라 재실행 때마다 초기화돼 하루 8건이 나갔습니다.
  max_live_per_day: 2
  # 같은 블로그의 연속 발행 최소 간격(분). 몇 분 사이에 여러 건이 올라가는 패턴을 막습니다.
  min_gap_minutes: 45
  default_labels:
    - 실시간이슈

# 수익화. 애드센스는 Blogger 설정에서 켜면 템플릿이 알아서 광고를 넣으므로 여기 없습니다.
monetize:
  coupang:
    # 검수관이 '구매 의도가 있는 주제'로 본 글에만 관련 상품 링크를 넣습니다.
    # COUPANG_ACCESS_KEY / COUPANG_SECRET_KEY 가 없으면 자동으로 건너뜁니다.
    enabled: true
    max_products: 3
    heading: 관련 상품 살펴보기

# 글감 기획 (src/planner.py) — 블로그 고유 주제 안에서 글감을 만듭니다.
# 2026-09-20 이후 기본 운영 방식입니다. 실시간 검색어를 보지 않으므로 블로그 간 주제 충돌이
# 설계상 발생하지 않고, 글 수명이 길어 하루 2건으로도 누적이 쌓입니다.
planner:
  model: claude-sonnet-5
  candidates: 8          # 한 번에 제안할 글감 수 (이력과 안 겹치는 것부터 씁니다)

# 함대 관리 에이전트 (src/manager.py) — 블로그별 지표를 보고 중지/재개/글 수 조정을 판단합니다.
manager:
  model: claude-sonnet-5

# 장수(evergreen) 글 — 주 1회 실행. 실시간 이슈의 배경 개념을 해설하는 글을 씁니다.
# 실시간 글은 유입 수명이 1~3일이라, 이 글들이 광고 수익의 바닥을 만듭니다.
evergreen:
  posts_per_run: 2
  candidates: 6              # 모델이 제안할 주제 수 (그중 이력과 안 겹치는 것부터 씁니다)
  lookback_days: 30
  topic_model: claude-sonnet-5
  default_labels:
    - 알아두기
